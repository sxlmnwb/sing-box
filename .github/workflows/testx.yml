name: Test build on actions
on:
  workflow_dispatch:
  push:

jobs:
  go:
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.go.outputs.version}}
    steps:
      - name: get latest go version
        id: go
        run: |
          echo version=$(curl -s https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json | grep -oE '"version": "[0-9]{1}.[0-9]{1,}(.[0-9]{1,})?"' | head -1 | cut -d':' -f2 | sed 's/ //g; s/"//g') >> $GITHUB_OUTPUT
  sing-box:
    runs-on: ubuntu-latest
    needs: go
    outputs:
      version: ${{steps.sing-box.outputs.version}}
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: ${{needs.go.outputs.version}}
      - name: get sing-box version
        id: sing-box
        run: |
          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch --tags upstream
          version=$(echo "v"$(CGO_ENABLED=0 go run ./cmd/internal/read_tag))
          echo version=$version >> $GITHUB_OUTPUT
  build-test:
    runs-on: ubuntu-latest
    needs:
      - go
      - sing-box
    env:
        VERSION: ${{needs.sing-box.outputs.version}}
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: ${{needs.go.outputs.version}}
      - name: build core
        run: |
          TAGS="with_gvisor,with_dhcp,with_wireguard,with_reality_server,with_clash_api,with_quic,with_utls,with_ech"
          CC="$(which cc)"
          CCV=$("$CC" --version | head -n 1)
          DATE=$(date +"%a %b %d %I:%M:%S %p %Z %Y")
          go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -X 'github.com/sagernet/sing-box/constant.CCVersion=${CCV}' -X 'github.com/sagernet/sing-box/constant.DATEBuild=${DATE}' -s -w -buildid=" -tags "${TAGS}" ./cmd/sing-box
          ./sing-box version
